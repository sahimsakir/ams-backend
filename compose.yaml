name: ams
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ams
      POSTGRES_USER: ams
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ams -d ams"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: .
    env_file: .env
    environment: &app_env
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ams
      DB_USERNAME: ams
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
      MAIL_MAILER: smtp
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      FACE_URL: http://face:8001
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["private_storage:/app/storage/app"]
    depends_on:
      postgres: {condition: service_healthy}
      face: {condition: service_started}
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost:8000/up') === false ? 1 : 0);"]
      interval: 20s
      timeout: 5s
      retries: 5
  worker:
    build: .
    env_file: .env
    environment: *app_env
    command: php artisan queue:work --tries=3 --timeout=60
    restart: unless-stopped
    volumes: ["private_storage:/app/storage/app"]
    depends_on:
      postgres: {condition: service_healthy}
  face:
    build: ./face-service
    environment:
      FACE_SERVICE_KEY: ${FACE_SERVICE_KEY:?Set FACE_SERVICE_KEY}
    # Internal only: no published port.
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:8025:8025"]
volumes:
  postgres_data:
  private_storage:
